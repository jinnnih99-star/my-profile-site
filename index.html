<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나의 프로필</title>

  <!-- 다크모드 깜빡임 방지: 페이지가 그려지기 전에 테마를 먼저 적용 -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.classList.add('dark');
    })();
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['"Noto Sans KR"', 'sans-serif'] }
        }
      }
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased">

  <!-- 헤더 -->
  <header class="fixed inset-x-0 top-0 z-50 border-b border-slate-200/70 bg-white/70 backdrop-blur-md dark:border-slate-800 dark:bg-slate-950/70">
    <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-4 sm:px-6">
      <a href="#home" id="brand" class="text-lg font-black text-blue-600"></a>

      <nav class="hidden items-center gap-7 md:flex">
        <a href="#about" class="nav-link text-sm font-medium text-slate-600 hover:text-blue-600 dark:text-slate-300">소개</a>
        <a href="#skills" class="nav-link text-sm font-medium text-slate-600 hover:text-blue-600 dark:text-slate-300">기술</a>
        <a href="#projects" class="nav-link text-sm font-medium text-slate-600 hover:text-blue-600 dark:text-slate-300">프로젝트</a>
        <a href="#contact" class="nav-link text-sm font-medium text-slate-600 hover:text-blue-600 dark:text-slate-300">연락처</a>
      </nav>

      <div class="flex items-center gap-2">
        <button id="theme-toggle" type="button" aria-label="다크모드 전환"
          class="rounded-full p-2 text-slate-600 hover:bg-slate-200/70 dark:text-slate-300 dark:hover:bg-slate-800">
          <svg class="hidden h-5 w-5 dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364-.707-.707M6.343 6.343l-.707-.707m12.728 0-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <svg class="h-5 w-5 dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>

        <button id="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false"
          class="rounded-full p-2 text-slate-600 hover:bg-slate-200/70 md:hidden dark:text-slate-300 dark:hover:bg-slate-800">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
    </div>

    <!-- 모바일 메뉴 -->
    <nav id="mobile-menu" class="hidden border-t border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-950 md:hidden">
      <div class="flex flex-col px-4 py-3">
        <a href="#about" class="mobile-link py-3 text-sm font-medium text-slate-700 dark:text-slate-200">소개</a>
        <a href="#skills" class="mobile-link py-3 text-sm font-medium text-slate-700 dark:text-slate-200">기술</a>
        <a href="#projects" class="mobile-link py-3 text-sm font-medium text-slate-700 dark:text-slate-200">프로젝트</a>
        <a href="#contact" class="mobile-link py-3 text-sm font-medium text-slate-700 dark:text-slate-200">연락처</a>
      </div>
    </nav>
  </header>

  <main>
    <!-- Hero -->
    <section id="home" class="px-4 pb-20 pt-28 sm:px-6 md:pt-36">
      <div class="mx-auto grid max-w-6xl items-center gap-14 lg:grid-cols-2">

        <!-- 좌측: 텍스트 컨테이너 -->
        <div class="reveal">
          <div class="inline-flex rounded-full border border-slate-200 bg-slate-100 p-1 dark:border-slate-800 dark:bg-slate-900">
            <a href="#projects" class="rounded-full border border-slate-200 bg-white px-5 py-2 text-sm font-bold text-slate-900 shadow-sm dark:border-slate-700 dark:bg-slate-800 dark:text-white">프로젝트 보기</a>
            <a href="#contact" class="rounded-full px-5 py-2 text-sm font-semibold text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white">연락하기</a>
          </div>

          <h1 class="mt-8 text-4xl font-black leading-tight tracking-tight sm:text-5xl lg:text-6xl">
            <span id="hero-name"></span>
            <span id="hero-role" class="mt-2 block text-blue-600"></span>
          </h1>

          <ul id="hero-points" class="mt-8 space-y-4"></ul>

          <a href="#projects"
            class="mt-10 inline-flex items-center gap-2 rounded-full bg-slate-900 px-7 py-4 font-bold text-white shadow-lg transition hover:bg-blue-600 dark:bg-blue-600 dark:hover:bg-blue-500">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 3l1.5 4.5L11 9l-4.5 1.5L5 15l-1.5-4.5L-1 9l4.5-1.5L5 3zm10 6l2 6 6 2-6 2-2 6-2-6-6-2 6-2 2-6z" />
            </svg>
            프로젝트 보러가기
          </a>
        </div>

        <!-- 우측: 비주얼 컨테이너 -->
        <div class="reveal relative">
          <div class="rounded-[2.5rem] bg-sky-100 p-6 sm:p-10 dark:bg-slate-800">
            <div id="hero-avatar"
              class="flex aspect-[4/3] items-center justify-center rounded-[2rem] bg-gradient-to-br from-blue-500 via-sky-400 to-indigo-500 text-8xl font-black text-white shadow-xl">
            </div>
          </div>

          <!-- 떠 있는 통계 패널 -->
          <div class="absolute -right-2 top-14 hidden w-44 rounded-2xl bg-white p-4 shadow-xl sm:block dark:bg-slate-900">
            <ul id="hero-stats" class="space-y-3"></ul>
          </div>

          <!-- 하단 배지 -->
          <div class="absolute bottom-0 left-6 flex translate-y-1/2 items-center gap-3 rounded-full bg-white py-2 pl-2 pr-5 shadow-xl dark:bg-slate-900">
            <div id="badge-logo" class="flex h-10 w-10 items-center justify-center rounded-full bg-blue-600 font-black text-white"></div>
            <div>
              <p id="badge-name" class="text-sm font-bold"></p>
              <p id="badge-sub" class="text-xs text-slate-500 dark:text-slate-400"></p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 소개 -->
    <section id="about" class="px-4 py-20 sm:px-6">
      <div class="mx-auto max-w-6xl">
        <div class="reveal">
          <p class="text-sm font-bold uppercase tracking-widest text-blue-600">About</p>
          <h2 class="mt-2 text-3xl font-black sm:text-4xl">소개</h2>
        </div>
        <div id="about-text" class="reveal mt-8 space-y-4 text-lg leading-relaxed text-slate-600 dark:text-slate-300"></div>
      </div>
    </section>

    <!-- 기술 스택 -->
    <section id="skills" class="bg-white px-4 py-20 sm:px-6 dark:bg-slate-900">
      <div class="mx-auto max-w-6xl">
        <div class="reveal">
          <p class="text-sm font-bold uppercase tracking-widest text-blue-600">Skills</p>
          <h2 class="mt-2 text-3xl font-black sm:text-4xl">기술 스택</h2>
        </div>
        <div id="skill-list" class="mt-8 flex flex-wrap gap-3"></div>
      </div>
    </section>

    <!-- 프로젝트 -->
    <section id="projects" class="px-4 py-20 sm:px-6">
      <div class="mx-auto max-w-6xl">
        <div class="reveal">
          <p class="text-sm font-bold uppercase tracking-widest text-blue-600">Projects</p>
          <h2 class="mt-2 text-3xl font-black sm:text-4xl">프로젝트</h2>
        </div>
        <div id="project-list" class="mt-10 grid gap-6 md:grid-cols-2 lg:grid-cols-3"></div>
      </div>
    </section>

    <!-- 연락처 -->
    <section id="contact" class="px-4 py-20 sm:px-6">
      <div class="reveal mx-auto max-w-6xl rounded-[2.5rem] bg-gradient-to-br from-blue-600 to-sky-500 p-10 text-center text-white shadow-xl sm:p-16">
        <p class="text-sm font-bold uppercase tracking-widest text-blue-100">Contact</p>
        <h2 class="mt-2 text-3xl font-black sm:text-4xl">함께 이야기해요</h2>
        <p id="contact-desc" class="mt-4 text-blue-100"></p>
        <div id="contact-links" class="mt-8 flex flex-wrap justify-center gap-4"></div>
      </div>
    </section>
  </main>

  <footer class="border-t border-slate-200 px-4 py-8 text-center text-sm text-slate-500 dark:border-slate-800 dark:text-slate-400">
    <p id="footer-text"></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
